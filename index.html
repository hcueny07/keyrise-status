<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Your Home Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F0;--card:#FFFFFF;--ink:#1C3229;--muted:#5E5A52;--line:#ECE7DC;--gold:#937A3E;--goldl:#D4B483;--band:#1C3229;--done:#EEF1EF}
@media (prefers-color-scheme:dark){:root{--bg:#111B17;--card:#18241F;--ink:#EDE8DD;--muted:#A9A396;--line:#2A3832;--gold:#D4B483;--band:#0C1512;--done:#1F2D27}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.5}
header{background:var(--band);color:#F4EFE4;padding:calc(36px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 30px max(20px,env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin:0 auto}
.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--goldl)}
h1{font-family:Marcellus,Georgia,serif;font-weight:400;font-size:30px;line-height:1.2;margin:8px 0 4px}
.sub{opacity:.8;font-size:15px}
main{padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(28,50,41,.06);margin-bottom:14px}
.label{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bar{height:5px;border-radius:3px;background:var(--line)}
.bar.on{background:var(--ink)}.bar.now{background:var(--gold)}
.stepnames{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;font-size:12px;color:var(--muted)}
.stepnames .cur{color:var(--ink);font-weight:500}
.row{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.dot{width:12px;height:12px;border-radius:6px;margin-top:6px;flex-shrink:0;border:2px solid var(--gold)}
.dot.done{background:var(--ink);border-color:var(--ink)}
.what{flex:1;min-width:0}
.when{font-size:14px;color:var(--muted)}
.row.done .what{color:var(--muted);text-decoration:line-through}
.empty,.note{color:var(--muted);font-size:14px}
footer{text-align:center;font-size:12px;color:var(--muted);letter-spacing:1px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="eyebrow" id="brokerage">Your home</div>
  <h1 id="title">Loading your timeline…</h1>
  <div class="sub" id="sub"></div>
</div></header>
<main><div class="wrap" id="content"></div></main>
<footer>Powered by Keyrise</footer>
<script>
(function () {
  var URL_ = 'https://ovwsmktnufozcyaqaqfz.supabase.co/rest/v1/rpc/client_status';
  var KEY = 'sb_publishable_IvKFJC5hSi_ydgtLY5wk-A_FeJHikgb'; // public key; this page can only call client_status
  var token = (location.hash.match(/t=([A-Za-z0-9_-]{32,64})/) || [])[1] || '';
  var el = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  function fmt(d) {
    var p = String(d).split('-'); var dt = new Date(+p[0], +p[1] - 1, +p[2]);
    return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'long', day: 'numeric' });
  }
  function off() {
    el('title').textContent = 'This link isn’t active';
    el('content').innerHTML = '<div class="card"><p class="note">Ask your agent for a new link to see your timeline.</p></div>';
  }
  if (!token) return off();
  fetch(URL_, { method: 'POST', headers: { 'apikey': KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ t: token }) })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (!d) return off();
      var buyer = /buyer/i.test(d.role || '') && !/seller/i.test(d.role || '');
      var names = buyer ? ['Searching', 'Under contract', 'Closing', 'Closed'] : ['Listed', 'Under contract', 'Closing', 'Closed'];
      var today = new Date(); today.setHours(0,0,0,0);
      var closing = (d.dates || []).find(function (x) { return /clos/i.test(x.label) && !x.done; });
      var soon = closing && (new Date(closing.date + 'T00:00:00') - today) / 86400000 <= 14;
      var step = d.stage === 'Closed' ? 3 : d.stage === 'Under contract' ? (soon ? 2 : 1) : 0;
      el('brokerage').textContent = d.brokerage || 'Your home';
      el('title').textContent = d.street;
      el('sub').textContent = (d.first ? 'Hi ' + d.first + ', ' : '') + 'here’s where things stand.';
      var bars = names.map(function (_, i) { return '<div class="bar ' + (i < step ? 'on' : i === step ? 'now' : '') + '"></div>'; }).join('');
      var labels = names.map(function (n, i) { return '<div class="' + (i === step ? 'cur' : '') + '">' + n + '</div>'; }).join('');
      var rows = (d.dates || []).map(function (x) {
        return '<div class="row' + (x.done ? ' done' : '') + '"><div class="dot' + (x.done ? ' done' : '') + '"></div><div class="what">' + esc(x.label) + '<div class="when">' + fmt(x.date) + '</div></div></div>';
      }).join('');
      el('content').innerHTML =
        '<div class="card"><div class="label">Progress</div><div class="steps">' + bars + '</div><div class="stepnames">' + labels + '</div></div>' +
        '<div class="card"><div class="label">Key dates</div>' + (rows || '<p class="empty">Your agent will add the dates here soon.</p>') + '</div>' +
        '<p class="note">Updated live. Questions? Reach out to your agent anytime.</p>';
    })
    .catch(off);
})();
</script>
</body>
</html>
